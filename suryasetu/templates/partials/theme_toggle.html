<button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle day and night mode" title="Switch to day mode">
  <svg class="ico theme-icon-sun" viewBox="0 0 24 24"><use href="#i-sun"/></svg>
  <svg class="ico theme-icon-moon" viewBox="0 0 24 24"><use href="#i-moon"/></svg>
</button>
